# Local-only acceptance route. Replace using an untracked config for production.
global:
  resolve_timeout: 1m
route:
  receiver: local-acceptance
  group_by: [alertname, queue, acceptance_id]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: local-acceptance
    webhook_configs:
      - url: http://alert-webhook:8080/alerts
        send_resolved: true
