global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: chemicalops-api
    metrics_path: /metrics
    static_configs:
      # Add one target per API instance; retain the instance label for process-local counters.
      - targets: ["host.docker.internal:8888"]
