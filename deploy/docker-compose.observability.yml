name: chemicalops-observability

services:
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - chemicalops_alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=

  # Local acceptance receiver, not a production notification destination.
  alert-webhook:
    image: python:3.11-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERT_WEBHOOK_PORT:-19093}:8080"
    volumes:
      - ./observability/local_webhook.py:/app/local_webhook.py:ro
      - chemicalops_alert_webhook_data:/data
    command: ["python", "-u", "/app/local_webhook.py"]

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v3.5.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/secrets:/etc/prometheus/secrets:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - chemicalops_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

  grafana:
    image: mirror.gcr.io/grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - chemicalops_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  jaeger:
    image: mirror.gcr.io/jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  chemicalops_alertmanager_data:
  chemicalops_alert_webhook_data:
  chemicalops_prometheus_data:
  chemicalops_grafana_data:
