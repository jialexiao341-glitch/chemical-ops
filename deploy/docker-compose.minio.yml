services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: chemicalops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-chemicalops_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_minio_password}
    volumes:
      - chemicalops_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-31Z
    container_name: chemicalops-minio-init
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 2; done; mc mb --ignore-existing local/chemicalops-documents; mc mb --ignore-existing local/chemicalops-results; mc anonymous set none local/chemicalops-documents; mc anonymous set none local/chemicalops-results"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-chemicalops_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_minio_password}

volumes:
  chemicalops_minio_data:
