name: ChemicalOps CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chemicalops
          MYSQL_USER: chemicalops
          MYSQL_PASSWORD: chemicalops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: "true"
      APP_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: chemicalops
      MYSQL_USER: chemicalops
      MYSQL_PASSWORD: chemicalops
      MYSQL_ROOT_PASSWORD: root
      DEMO_DEFAULT_PASSWORD: ChemicalOps@2026
      JWT_SECRET_KEY: ci-only-secret-key-with-enough-length-for-tests
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare isolated test configuration
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_DATABASE=chemicalops
          MYSQL_USER=chemicalops
          MYSQL_PASSWORD=chemicalops
          MYSQL_ROOT_PASSWORD=root
          DEMO_DEFAULT_PASSWORD=ChemicalOps@2026
          JWT_SECRET_KEY=ci-only-secret-key-with-enough-length-for-tests
          FILE_STORAGE_BACKEND=local
          FILE_STORAGE_ROOT=tmp/test-storage
          EOF
      - name: Initialize blank MySQL database and apply all migrations
        run: python scripts/init_database.py
      - name: Seed isolated test master data and accounts
        run: |
          python scripts/seed_demo_master_data.py
          python scripts/seed_demo_accounts.py
      - name: Verify migration ledger and repeat upgrade
        run: |
          python scripts/migrate_database.py status
          python scripts/migrate_database.py upgrade --no-backup
          python scripts/migrate_database.py status
      - name: Verify upgrade from the previous release and interrupted DDL recovery
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE chemicalops_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -P3306 -uroot -proot chemicalops_upgrade < database/schema.sql
          MYSQL_DATABASE=chemicalops_upgrade MYSQL_USER=root MYSQL_PASSWORD=root python scripts/migrate_database.py upgrade --target 020 --no-backup
          MYSQL_DATABASE=chemicalops_upgrade MYSQL_USER=root MYSQL_PASSWORD=root python scripts/migrate_database.py upgrade --target 021 --no-backup
          mysql -h127.0.0.1 -P3306 -uroot -proot chemicalops_upgrade -e "ALTER TABLE sys_idempotency_records ADD COLUMN response_headers JSON NULL"
          MYSQL_DATABASE=chemicalops_upgrade MYSQL_USER=root MYSQL_PASSWORD=root python scripts/migrate_database.py upgrade --target 022 --no-backup
          MYSQL_DATABASE=chemicalops_upgrade MYSQL_USER=root MYSQL_PASSWORD=root python scripts/migrate_database.py upgrade --no-backup
      - name: Compile backend
        run: python -m compileall -q backend/app scripts tests
      - name: Verify frozen evaluation fixtures and deterministic safety guards
        run: |
          python scripts/check_evaluation_fixtures.py
          python -m pytest -q -p no:cacheprovider tests/test_evaluation_fixtures.py tests/test_ai_numeric_associations.py tests/test_numeric_fidelity.py tests/test_agent_read_tools.py tests/test_ai_purchase_draft_confirmations.py tests/test_ai_batch_execution.py
      - name: Dependency and code security scan
        run: |
          python -m pip install pip-audit bandit
          pip-audit -r backend/requirements.txt
          bandit -q -r backend/app scripts
      - name: Run tests
        run: python -m pytest --strict-config --strict-markers -q -rs
      - name: Start API for smoke load test
        run: |
          PYTHONPATH=backend python -m uvicorn app.main:app --host 127.0.0.1 --port 8888 > /tmp/chemicalops-api.log 2>&1 &
          echo $! > /tmp/chemicalops-api.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8888/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API health check failed")
          PY
      - name: Run smoke load test
        run: PYTHONPATH=backend python scripts/run_load_test.py --url http://127.0.0.1:8888/health --requests 100 --concurrency 10
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/chemicalops-api.pid ]; then kill "$(cat /tmp/chemicalops-api.pid)" || true; fi
          if [ -f /tmp/chemicalops-api.log ]; then cat /tmp/chemicalops-api.log; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # monorepo 要求 pnpm >= 11
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          # vben monorepo 要求 node ^22.18.0 || ^24.12.0
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-design/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend-design
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: frontend-design/apps/web-chemicalops
        run: pnpm exec vue-tsc --noEmit --skipLibCheck
      - name: Frontend unit tests
        working-directory: frontend-design
        run: pnpm exec vitest run --dom apps/web-chemicalops/src
      - name: Build frontend
        working-directory: frontend-design
        run: pnpm build:chemicalops
      - name: Frontend dependency security audit
        working-directory: frontend-design
        run: pnpm audit --audit-level high
