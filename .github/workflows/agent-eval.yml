name: Agent Eval Gate

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 Asia/Shanghai（UTC 周日 18:00）
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.deepseek.com' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run live eval and prompt gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY 未配置，跳过真实模型评测"
            exit 0
          fi
          python scripts/run_eval_suite.py --suite all \
            --output-dir docs/evaluation/candidate \
            --gate --fail-on-regression
      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-candidate
          path: docs/evaluation/candidate
          if-no-files-found: ignore