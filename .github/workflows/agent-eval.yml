name: Agent Eval Gate

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 Asia/Shanghai（UTC 周日 18:00）
    - cron: "0 18 * * 0"

permissions:
  contents: read

# 采样期间不并发：两次全量同时打同一模型会互相限流，污染两轮证据。
concurrency:
  group: agent-eval-gate
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 默认值必须与基线 envelope 的模型一致；换成其他模型会被门禁判 INVALID_RUN，
      # 需先在同一模型下重跑并登记新基线，不能用跨模型结果判回归。
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://ai.max66.xyz/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-v4.1-flash' }}
      LLM_REASONING_EFFORT: high
      EVAL_OUTPUT_DIR: docs/evaluation/candidate
      # 评测只调用真实模型与隔离 SQLite，不需要数据库；但 prompt 版本指纹要从 Agent 模块里取提示词正文，
      # 导入链路会构造数据库引擎。这里给一组不可达的占位配置，模型目录读取失败后按设计回退到上面的环境变量。
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: chemicalops_eval
      MYSQL_USER: eval
      MYSQL_PASSWORD: eval_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run eval harness and envelope gate
        shell: bash
        run: |
          set -o pipefail
          # 定时任务缺密钥不能静默成功：否则每周“绿色”但零门禁结论，门禁可信度被掏空。
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::未配置 OPENAI_API_KEY，无法产出评测门禁结论"
            {
              echo "## Agent Eval Gate 未执行——缺少 OPENAI_API_KEY"
              echo
              echo "未配置仓库 Secret \`OPENAI_API_KEY\`，本次运行不产生通过/回归结论，按失败处理。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python scripts/run_eval_suite.py --suite all \
            --output-dir "$EVAL_OUTPUT_DIR" \
            --harness --repeat 3 --business-workers 3 \
            --preflight --require-baseline \
            --gate --fail-on-regression 2>&1 | tee eval-gate.log
      - name: Publish gate summary
        if: always()
        shell: bash
        run: |
          if [ -f eval-gate.log ]; then
            {
              echo "## Agent Eval Gate（envelope 口径）"
              echo '```text'
              # 只取结论段，避免把依赖安装日志贴进摘要。
              tail -n 120 eval-gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate envelopes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-candidate
          path: |
            docs/evaluation/candidate
            eval-gate.log
          if-no-files-found: ignore
          retention-days: 30